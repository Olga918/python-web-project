<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нове завдання</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 0.75rem; font-weight: 600; }
        input[type="text"], input[type="date"], textarea { width: 100%; box-sizing: border-box; margin-top: 0.25rem; padding: 0.45rem; }
        textarea { min-height: 120px; }
        button { margin-top: 1rem; padding: 0.5rem 1.2rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .error { color: #b91c1c; margin-top: 0.5rem; }
        a.back { display: inline-block; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>Нове завдання</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{% url 'task_add' %}">
        {% csrf_token %}
        <label for="title">Заголовок</label>
        <input id="title" name="title" type="text" value="{{ title|default:'' }}" required maxlength="200">

        <label for="text">Текст задачі</label>
        <textarea id="text" name="text" required>{{ text|default:'' }}</textarea>

        <label for="start_date">Дата початку</label>
        <input id="start_date" name="start_date" type="date" value="{{ start_date|default:'' }}" required>

        <label for="end_date">Дата завершення</label>
        <input id="end_date" name="end_date" type="date" value="{{ end_date|default:'' }}" required>

        <button type="submit">Зберегти</button>
    </form>
    <p><a class="back" href="{% url 'task_list' %}">← До списку</a></p>
</body>
</html>
