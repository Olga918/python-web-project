{% extends "_layout.html" %}

{% block title %}Видалити — {{ movie.title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col s12 m8 offset-m2">
        <div class="card red lighten-5">
            <div class="card-content">
                <span class="card-title red-text text-darken-3">Видалити фільм?</span>
                <p>Ви впевнені, що хочете видалити <strong>{{ movie.title }}</strong>?</p>
                <p>Рейтинг: {{ movie.rating }}/5 · {{ movie.release_date|date:"d.m.Y" }}</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn red darken-2 waves-effect">
                        <i class="material-icons left">delete</i>Так, видалити
                    </button>
                    <a href="{% url 'movieDetail' movie.pk %}" class="btn-flat">Скасувати</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
