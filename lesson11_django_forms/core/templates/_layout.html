{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Фільми{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="{% static "css/materialize.min.css" %}" media="screen,projection"/>
    <link type="text/css" rel="stylesheet" href="{% static "css/global.css" %}?v=3">
    {% block extra_css %}{% endblock %}
    <link rel="icon" href="{% static "favicon.ico" %}" type="image/x-icon">
</head>
<body>
    <nav class="indigo darken-4">
        <div class="nav-wrapper container">
            <a href="{% url 'movieList' %}" class="brand-logo">Кіно</a>
            <ul class="right hide-on-med-and-down">
                <li><a href="{% url 'movieList' %}">Головна</a></li>
                <li><a href="{% url 'movieAdd' %}">Додати фільм</a></li>
                {% if user.is_staff %}
                <li><a href="{% url 'admin:index' %}">Адмін</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <main class="container" style="margin-top: 24px;">
        {% block content %}{% endblock %}
        {% block form %}{% endblock %}
        {% block userPage %}{% endblock %}
    </main>

    <script src="{% static 'js/index.js' %}"></script>
    <script type="text/javascript" src="{% static "js/materialize.min.js" %}"></script>
</body>
</html>
