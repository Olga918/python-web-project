{% extends "_layout.html" %}

{% block userPage %}
  <div class="row">
    <div class="col s12">
      <div class="card">
        {% if imageUrl %}
        <div class="card-image">
          <img src="{{ imageUrl }}" alt="Profile photo">
          <span class="card-title">Congratulations with Sign Up</span>
        </div>
        {% else %}
        <div class="card-content">
          <span class="card-title">Congratulations with Sign Up</span>
        </div>
        {% endif %}
        <div class="card-content">
          <h3>Welcome, {{ name }} {{ surname }}</h3>
          <p>Age: {{ age }}</p>
        </div>
      </div>
    </div>
  </div>
{% endblock userPage %}
