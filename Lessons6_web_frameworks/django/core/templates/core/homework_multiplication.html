<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Таблиця множення 1–10</title>
  <style>
    table { border-collapse: collapse; font-family: system-ui, sans-serif; }
    th, td { border: 1px solid #333; padding: 6px 10px; text-align: center; min-width: 2.5em; }
    th { background: #e8eef5; font-weight: 600; }
    caption { caption-side: top; font-weight: bold; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <table>
    <caption>Таблиця множення від 1 до 10</caption>
    <thead>
      <tr>
        <th>×</th>
        {% for j in nums %}<th>{{ j }}</th>{% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <th>{{ forloop.counter }}</th>
        {% for cell in row %}<td>{{ cell }}</td>{% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
