<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>{{ task.title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 1rem auto; }
    .meta { color: #444; font-size: 0.95rem; }
  </style>
</head>
<body>
  <p class="meta">Знайдено за: <strong>{{ found_by }}</strong> (динамічний сегмент URL)</p>
  <h1>{{ task.title }}</h1>
  <p>id: <code>{{ task.id }}</code>, slug: <code>{{ task.slug }}</code></p>
  <p>Статус: {% if task.done %}виконано{% else %}не виконано{% endif %}</p>
  <p><a href="{% url 'homework3' %}">← до списку</a></p>
</body>
</html>
