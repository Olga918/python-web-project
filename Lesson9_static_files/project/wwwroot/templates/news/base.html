{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/materialize.min.css' %}" media="screen,projection" />
  <link rel="stylesheet" href="{% static 'css/portal.css' %}" />
</head>
<body class="portal-newspaper">
  <header class="portal-header">
    <div class="container">
      <div class="brand">
        <a href="{% url 'news:home' %}">{{ SITE_NAME }}</a>
      </div>
    </div>
  </header>

  <main class="container portal-sheet" style="padding: 24px; min-height: 50vh;">
    {% block content %}{% endblock %}
  </main>

  <footer class="portal-footer">
    <div class="container center-align">
      <a href="{% url 'news:home' %}" class="site-name">{{ SITE_NAME }}</a>
      <div class="grey-text text-darken-1" style="margin-top: 8px; font-size: 0.9rem;">
        © {% now "Y" %}
      </div>
    </div>
  </footer>

  <script src="{% static 'js/materialize.min.js' %}"></script>
</body>
</html>
